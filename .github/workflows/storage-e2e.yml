name: Storage E2E

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapter:
    name: ${{ matrix.backend }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        backend:
          - redis
          - postgres
          - mysql
          - mongodb
          - mssql

    steps:
      - name: Check out frozen source and Go port
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: |
            go.sum
            e2e/go.sum

      - name: Run required real-service contract
        working-directory: e2e
        env:
          SINGLE_AUTH_E2E_REQUIRED: "1"
        run: go test "./${{ matrix.backend }}" -count=1 -timeout=15m -v
